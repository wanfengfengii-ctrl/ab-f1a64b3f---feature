services:
  web:
    build: .
    image: sounding-chain:latest
    # 宿主机端口可通过环境变量 HOST_PORT 配置，默认 8000
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3); sys.exit(0 if json.load(r).get('status')=='ok' else 1)"
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5

  # 一次性校验服务：等待 web 健康后运行 pytest、构建检查与真实 HTTP 冒烟，
  # 完成后自行退出；退出码即测试/构建/冒烟的综合结果（0=全部通过）。
  verify:
    build: .
    image: sounding-chain:latest
    depends_on:
      web:
        condition: service_healthy
    environment:
      - BASE_URL=http://web:8000
    entrypoint: ["sh", "scripts/verify.sh"]
    restart: "no"
